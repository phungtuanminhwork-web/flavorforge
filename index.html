<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlavorForge | AI Recipe Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-fast {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-fast { animation: pulse-fast 1s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-4 md:p-8">

  <div class="max-w-3xl mx-auto">
    <!-- Header -->
    <header class="mb-8 text-center">
      <h1 class="text-4xl font-bold text-orange-600 mb-2">FlavorForge</h1>
      <p class="text-gray-600">Turn your pantry leftovers into culinary masterpieces.</p>
    </header>

    <!-- API Key Setup (Required for client-side only apps) -->
    <div id="api-key-section" class="bg-orange-50 border border-orange-200 p-4 rounded-xl mb-8 flex flex-col md:flex-row gap-4 items-center">
      <div class="flex-1">
        <h3 class="font-bold text-orange-800 text-sm mb-1">Enter your Gemini API Key to start</h3>
        <p class="text-xs text-orange-600">This stays in your browser and isn't saved anywhere.</p>
      </div>
      <input type="password" id="api-key-input" placeholder="AIzaSy..." class="border border-orange-300 p-2 rounded flex-1 focus:outline-none focus:ring-2 focus:ring-orange-500">
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app-container" class="bg-white p-6 md:p-8 rounded-xl shadow-sm border border-gray-100 transition-all duration-300">
      
      <!-- VIEW 1: INGREDIENT INPUT -->
      <div id="view-input" class="block">
        <h2 class="text-2xl font-bold mb-4">What's in your pantry?</h2>
        
        <div id="error-message" class="hidden bg-red-50 text-red-600 p-3 rounded mb-4 text-sm border border-red-200"></div>

        <div class="mb-6">
          <div id="chips-container" class="flex flex-wrap gap-2 mb-3"></div>
          <input type="text" id="ingredient-input" placeholder="Type an ingredient and press Enter or Comma..." class="w-full border border-gray-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500">
        </div>

        <label class="flex items-center space-x-3 mb-8 cursor-pointer">
          <input type="checkbox" id="staples-toggle" checked class="w-5 h-5 text-orange-600 rounded focus:ring-orange-500">
          <span class="text-gray-700">Assume I have basic pantry staples (oil, salt, pepper, garlic)</span>
        </label>

        <button id="generate-btn" class="w-full bg-orange-600 text-white font-bold py-4 rounded-lg hover:bg-orange-700 transition-colors text-lg">
          Generate Recipes
        </button>
      </div>

      <!-- VIEW 2: LOADING -->
      <div id="view-loading" class="hidden text-center py-12">
        <div class="text-6xl mb-4 animate-bounce">🍳</div>
        <h2 id="loading-text" class="text-2xl font-bold text-orange-600 animate-pulse-fast">Analyzing flavor profiles...</h2>
      </div>

      <!-- VIEW 3: RESULTS (CARDS) -->
      <div id="view-results" class="hidden">
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold">Your Options</h2>
          <button onclick="resetApp()" class="text-gray-500 hover:underline">Start Over</button>
        </div>
        <div id="cards-container" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
      </div>

      <!-- VIEW 4: RECIPE DETAIL -->
      <div id="view-detail" class="hidden">
        <button onclick="showView('view-results')" class="text-orange-500 hover:underline mb-4 inline-block">&larr; Back to Options</button>
        <div id="recipe-content"></div>
        <div class="flex flex-wrap gap-4 mt-8">
          <button onclick="showToast('Recipe Saved!')" class="bg-orange-100 text-orange-700 px-6 py-2 rounded-lg hover:bg-orange-200 font-bold">Save Recipe</button>
          <button onclick="showToast('Marked as Cooked!')" class="bg-orange-600 text-white px-6 py-2 rounded-lg hover:bg-orange-700 font-bold">I Cooked This!</button>
        </div>
      </div>

    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 bg-green-500 text-white px-6 py-3 rounded shadow-lg transform transition-transform duration-300 translate-x-[200%]">
      <span id="toast-msg"></span> 🎉 Bon Appétit!
    </div>
  </div>

  <script>
    // State
    let ingredients = [];
    let generatedRecipes = [];
    let loadingInterval;

    // DOM Elements
    const ingredientInput = document.getElementById('ingredient-input');
    const chipsContainer = document.getElementById('chips-container');
    const generateBtn = document.getElementById('generate-btn');
    const apiKeyInput = document.getElementById('api-key-input');
    const errorMsg = document.getElementById('error-message');

    // Handle User Input (Comma or Enter)
    ingredientInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        const val = ingredientInput.value.trim().replace(',', '');
        if (val && !ingredients.includes(val)) {
          ingredients.push(val);
          renderChips();
        }
        ingredientInput.value = '';
      }
    });

    function renderChips() {
      chipsContainer.innerHTML = ingredients.map(ing => `
        <span class="bg-orange-100 text-orange-800 px-3 py-1 rounded-full text-sm flex items-center">
          ${ing}
          <button onclick="removeIngredient('${ing}')" class="ml-2 text-orange-600 hover:text-orange-900 font-bold">&times;</button>
        </span>
      `).join('');
    }

    window.removeIngredient = (ing) => {
      ingredients = ingredients.filter(i => i !== ing);
      renderChips();
    };

    // Navigation Helper
    function showView(viewId) {
      ['view-input', 'view-loading', 'view-results', 'view-detail'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(viewId).classList.remove('hidden');
    }

    window.resetApp = () => {
      ingredients = [];
      renderChips();
      showView('view-input');
    };

    window.showToast = (msg) => {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      toast.classList.remove('translate-x-[200%]');
      setTimeout(() => toast.classList.add('translate-x-[200%]'), 3000);
    };

    // Main API Call
    generateBtn.addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim();
      
      if (!apiKey) return showError("Please enter your Gemini API key at the top first.");
      if (ingredients.length < 2) return showError("We need a bit more! Add a protein, carb, or veggie.");
      
      errorMsg.classList.add('hidden');
      startLoading();

      const useStaples = document.getElementById('staples-toggle').checked;
      const pantryText = useStaples 
        ? "Assume they also have basic pantry staples (oil, salt, pepper, garlic, butter)." 
        : "They ONLY have exactly these ingredients and nothing else.";

      const prompt = `You are an expert culinary AI. The user has provided these ingredients: ${ingredients.join(", ")}.
      ${pantryText}
      Task: Generate exactly 3 distinct recipe options (e.g., The Safe Bet, The Creative Twist, The Quick Fix).
      Guardrails: If the ingredients contain non-edible items (like bleach), set the "error" field to "Please enter edible ingredients!"
      Respond STRICTLY using this JSON schema:
      {
        "error": "null",
        "recipes": [
          {
            "id": "1",
            "tagline": "The Safe Bet",
            "title": "Recipe Name",
            "time": "15 mins",
            "description": "Short description.",
            "formula": ["Ingredient 1", "Ingredient 2"],
            "steps": ["Step 1", "Step 2"]
          }
        ]
      }`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        const data = await response.json();
        
        if (data.error && data.error.message) throw new Error(data.error.message);
        
        const resultText = data.candidates[0].content.parts[0].text;
        const parsedData = JSON.parse(resultText);

        if (parsedData.error && parsedData.error !== "null") throw new Error(parsedData.error);

        generatedRecipes = parsedData.recipes;
        renderCards();
      } catch (err) {
        showError(err.message || "Our kitchen is overwhelmed. Please check your API key and try again.");
        showView('view-input');
      } finally {
        clearInterval(loadingInterval);
      }
    });

    function startLoading() {
      showView('view-loading');
      const phrases = ["Analyzing flavor profiles...", "Consulting the digital chef...", "Plating your options..."];
      let i = 0;
      const textEl = document.getElementById('loading-text');
      textEl.innerText = phrases[0];
      loadingInterval = setInterval(() => {
        i = (i + 1) % phrases.length;
        textEl.innerText = phrases[i];
      }, 2000);
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = generatedRecipes.map((r, idx) => `
        <div onclick="openRecipe(${idx})" class="bg-white p-6 rounded-xl border border-gray-200 hover:shadow-lg hover:border-orange-300 cursor-pointer transition-all flex flex-col h-full">
          <span class="text-xs font-bold uppercase tracking-wider text-orange-500 mb-2">${r.tagline}</span>
          <h3 class="text-xl font-bold mb-2 leading-tight">${r.title}</h3>
          <p class="text-sm text-gray-500 mb-4 font-bold">⏱ ${r.time}</p>
          <p class="text-sm text-gray-700 flex-1">${r.description}</p>
        </div>
      `).join('');
      showView('view-results');
    }

    window.openRecipe = (idx) => {
      const recipe = generatedRecipes[idx];
      document.getElementById('recipe-content').innerHTML = `
        <h2 class="text-3xl font-bold mb-2">${recipe.title}</h2>
        <p class="text-gray-500 mb-6 italic">${recipe.tagline} • ${recipe.time}</p>
        
        <h3 class="text-xl font-bold mb-3 border-b pb-2 text-orange-600">Flavor Formula</h3>
        <ul class="list-disc pl-5 mb-6 space-y-2">
          ${recipe.formula.map(item => `<li>${item}</li>`).join('')}
        </ul>

        <h3 class="text-xl font-bold mb-3 border-b pb-2 text-orange-600">Step-by-Step</h3>
        <ol class="list-decimal pl-5 mb-4 space-y-3">
          ${recipe.steps.map(step => `<li>${step}</li>`).join('')}
        </ol>
      `;
      showView('view-detail');
    }

    function showError(msg) {
      errorMsg.innerText = msg;
      errorMsg.classList.remove('hidden');
    }
  </script>
</body>
</html>
